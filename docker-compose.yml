services:
  postgres:
    image: postgres:16-alpine
    container_name: residencial-postgres
    restart: always
    environment:
      POSTGRES_DB: residencial_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-schemas.sql:/docker-entrypoint-initdb.d/init-schemas.sql
    networks:
      - residencial-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: residencial-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - residencial-network

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: residencial-identity-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/residencial_db?currentSchema=identity_schema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SERVER_PORT: 8081
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - residencial-network

  parking-service:
    build:
      context: ./services/parking-service
      dockerfile: Dockerfile
    container_name: residencial-parking-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/residencial_db?currentSchema=parking_schema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      - postgres
    networks:
      - residencial-network

  api-gateway:
    image: nginx:alpine
    container_name: residencial-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
    networks:
      - residencial-network

networks:
  residencial-network:
    driver: bridge

volumes:
  postgres_data:
