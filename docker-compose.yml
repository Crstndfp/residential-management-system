services:
  postgres:
    image: postgres:16-alpine
    container_name: residencial-postgres
    restart: always
    environment:
      POSTGRES_DB: residencial_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-all.sql:/docker-entrypoint-initdb.d/init-all.sql
    networks:
      - residencial-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: residencial-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - residencial-network

  identity-service:
    build:
      context: ./services/identity-service
      dockerfile: Dockerfile
    container_name: residencial-identity-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/residencial_db?currentSchema=identity_schema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SERVER_PORT: 8081
    ports:
      - "8081:8081"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - residencial-network

  finance-service:
    build:
      context: ./services/finance-service
      dockerfile: Dockerfile
    container_name: residencial-finance-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/residencial_db?currentSchema=finance_schema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      SERVER_PORT: 8082
    ports:
      - "8082:8082"
    depends_on:
      - postgres
      - rabbitmq
    networks:
      - residencial-network

  amenities-service:
    build:
      context: ./services/amenities-service
      dockerfile: Dockerfile
    container_name: residencial-amenities-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/residencial_db?currentSchema=amenities_schema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      FINANCE_SERVICE_URL: http://finance-service:8082
      SERVER_PORT: 8083
    ports:
      - "8083:8083"
    depends_on:
      - postgres
      - finance-service
    networks:
      - residencial-network

  parking-service:
    build:
      context: ./services/parking-service
      dockerfile: Dockerfile
    container_name: residencial-parking-service
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/residencial_db?currentSchema=parking_schema
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgrespassword
      FINANCE_SERVICE_URL: http://finance-service:8082
      SERVER_PORT: 8084
    ports:
      - "8084:8084"
    depends_on:
      - postgres
      - finance-service
    networks:
      - residencial-network

  api-gateway:
    image: nginx:alpine
    container_name: residencial-gateway
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - identity-service
      - finance-service
      - amenities-service
      - parking-service
    networks:
      - residencial-network

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: residencial-web
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - residencial-network

networks:
  residencial-network:
    driver: bridge

volumes:
  postgres_data:
