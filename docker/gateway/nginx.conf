events { worker_connections 1024; }

http {
    upstream identity_service {
        server identity-service:8081;
    }

    upstream finance_service {
        server finance-service:8082;
    }

    upstream amenities_service {
        server amenities-service:8083;
    }

    upstream parking_service {
        server parking-service:8084;
    }

    server {
        listen 80;

        # Identity & Community (US-101, US-102)
        location /api/v1/identity/ {
            proxy_pass http://identity_service/api/v1/identity/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Finance & Assets (US-201, US-202, US-203, US-204, US-205)
        location /api/v1/finance/ {
            proxy_pass http://finance_service/api/v1/finance/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Amenities, Governance & Operations (US-301, US-302, US-401, US-402, US-403, US-501, US-502)
        location /api/v1/amenities/ {
            proxy_pass http://amenities_service/api/v1/amenities/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Parking & Security Analytics (US-601, US-602, US-603)
        location /api/v1/parking/ {
            proxy_pass http://parking_service/api/v1/parking/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Gateway Health Check
        location /health {
            return 200 '{"status":"UP","gateway":"Nginx Reverse Proxy","services":["identity","finance","amenities","parking"]}';
            add_header Content-Type application/json;
        }
    }
}
